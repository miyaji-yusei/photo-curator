[package]
name = "photo-curator-core"
version = "0.1.0"
edition = "2021"

# **判断が絡むものは全部ここに置く。** 画面と入出力は各環境に任せる。
# cdylib は Android と Web、lib は PC（Tauri から直接使う）向け。
[lib]
# **namespace ＝ クレート名 ＝ ライブラリ名で揃える。**
#
# 生成された Kotlin は lib<namespace>.so を読み込み、
# uniffi_<クレート名>_... という記号を探す。3 つがずれると
# 実機で「library not found」か「undefined symbol」で落ちる。
name = "photo_curator_core"
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
# 保存の形は core が持つ。**各環境が独自に組み立てない。**
# サイドカー（NAS で共有する catalog.json）もこの形をそのまま使う。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.28", features = ["bindgen-tests"] }
