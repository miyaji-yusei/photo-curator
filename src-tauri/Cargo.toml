[package]
name = "photo-curator"
version = "0.1.0"
description = "A human-centered desktop workflow for curating large photo collections"
authors = []
edition = "2021"

[lib]
name = "photo_curator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
uuid = { version = "1", features = ["v4"] }
# dHash 用の 1/8 IDCT デコード。image 0.25 のバックエンド zune-jpeg は
# scaled decode を提供しないため、EXIF サムネイルが無い JPEG の
# フォールバック経路としてこちらを併用する。
jpeg-decoder = "0.3"
# 判断（星の付き方・連写のまとめ方・指紋）は core に任せる（設計 05 章
# 2026-09-23: PC も core を直接呼ぶ）。uniffi は要らないので切る。
photo-curator-core = { path = "../core", default-features = false }
# Amazon Photos 共有リンク（設計 08 章・07 章 段7）。PC は Rust から直接読む
# （ブラウザの CORS 制限を受けない）。同期・素朴な HTTP クライアントで足りる
# （scan.rs も async ランタイムを使わず std::thread::scope で並列化している流儀に合わせる）。
ureq = { version = "2", features = ["json"] }
