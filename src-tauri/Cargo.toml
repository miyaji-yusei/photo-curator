[package]
name = "photo-curator"
version = "0.1.0"
description = "A human-centered desktop workflow for curating large photo collections"
authors = []
edition = "2021"

[lib]
name = "photo_curator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
